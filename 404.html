<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LA CONDENÁ | Página no encontrada</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background-color: #f4efe3;
            color: #26351f;
            font-family: Georgia, "Times New Roman", serif;
            text-align: center;
        }

        .error {
            max-width: 600px;
        }

        .error img {
            width: 120px;
            max-width: 40%;
            margin-bottom: 35px;
        }

        .error h1 {
            margin: 0 0 20px;
            font-size: 64px;
            font-weight: 400;
        }

        .error h2 {
            margin: 0 0 25px;
            font-size: 32px;
            font-weight: 400;
        }

        .error p {
            margin: 0 0 35px;
            font-size: 18px;
            line-height: 1.7;
        }

        .boton {
            display: inline-block;
            padding: 15px 28px;
            background-color: #26351f;
            color: #f4efe3;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .error h1 {
                font-size: 52px;
            }

            .error h2 {
                font-size: 28px;
            }

            .error p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <main class="error">

        <img src="favicon.png" alt="LA CONDENÁ">

        <h1>404</h1>

        <h2>Parece que te has perdido entre los olivos.</h2>

        <p>
            Esta página no existe, pero siempre puedes volver a nuestra tierra.
        </p>

        <a href="index.html" class="boton">VOLVER A LA CONDENÁ</a>

</body>
</html>
